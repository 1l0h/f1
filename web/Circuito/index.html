<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <div>
            <a href="../index.html">
                <img src="../../.placeholders/logo.png" alt="Logo" height="50">
            </a>
        </div>
        <h1>TEMPORADA</h1>
        <div id="SeleccionarAnio">
            <Button><span>&lt;</span></Button>
            <h2>2026</h2>
            <button><span>&gt;</span></button>
        </div>
    </header>
    <section id="hero">
        <div id="heroContent">
            <div id="circuito">
                <img id="circuitoImg" src="../../../Circuitos/Monaco/Monaco.gif" alt="Circuito">
            </div>
            <div id="infoCircuito">
                <h2 id="gpTitle">Cargando...</h2>
                <div class="heroBody" id="heroBody">
                    <hr>
                    <p id="gpLong">-- km</p>
                    <p id="gpVueltas">-- vueltas</p>
                    <hr>
                    <h3 id="gpFecha">--</h3>
                    <p id="gpUbicacion">--</p>
                    <hr>
                </div>
            </div>
        </div>
    </section>
    <div id="heroSpacer"></div>
    <div id="posiciones">
        <h2>Posiciones</h2>
        <div id="posicionesList">
            <!-- lista generada desde la API -->
        </div>
    </div>
    <script src="../api.js"></script>
    <script>
        const hero = document.querySelector('#hero');
        const heroSpacer = document.querySelector('#heroSpacer');
        const circuito = document.querySelector('#circuito');
        const root = document.documentElement;
        const baseCircuitWidth = 400;
        const minCircuitWidth = 260;

        function maxHeroHeight() {
            return Math.max(window.innerHeight * 0.45, 320);
        }

        function headerHeightPx() {
            const rootSize = parseFloat(getComputedStyle(root).fontSize) || 16;
            return 7 * rootSize;
        }

        function updateHeroHeight() {
            const maxHeight = maxHeroHeight();
            const minHeroHeight = maxHeight / 3;
            const scroll = Math.min(window.scrollY, maxHeight - minHeroHeight);
            const currentHeight = Math.max(maxHeight - scroll, minHeroHeight);
            hero.style.height = `${currentHeight}px`;
            heroSpacer.style.height = `${currentHeight}px`;

            const shrinkRatio = (maxHeight - currentHeight) / (maxHeight - minHeroHeight);
            const currentWidth = Math.round(baseCircuitWidth - (baseCircuitWidth - minCircuitWidth) * shrinkRatio);
            circuito.style.width = `${currentWidth}px`;

            const collapsed = currentHeight <= maxHeight * 0.5;
            hero.classList.toggle('collapsed', collapsed);
        }

        async function loadGPFromQuery(){
            const q = new URLSearchParams(window.location.search);
            const name = q.get('c') || 'Monaco';
            try {
                const gp = await fetchGranPremioByName(name);
                if (!gp) return;
                document.getElementById('gpTitle').textContent = gp.nombre || '';
                document.getElementById('gpLong').textContent = `${gp.longitud ?? '--'} km`;
                document.getElementById('gpVueltas').textContent = `${gp.vueltas ?? '--'} vueltas`;
                document.getElementById('gpUbicacion').textContent = `${gp.ubicacion || ''} ${gp.anioCreacion ? '(' + (new Date(gp.anioCreacion)).getFullYear() + ')' : ''}`;
                if (gp.participaciones && gp.participaciones.length) {
                    const list = document.getElementById('posicionesList');
                    list.innerHTML = '';
                    gp.participaciones.sort((a,b)=>a.posicion - b.posicion).forEach(p => {
                        const div = document.createElement('div');
                        div.className = 'piloto';
                        const piloto = p.piloto || {};
                        div.innerHTML = `
                            <span class="numero">${p.posicion}</span>
                            <div class="separador"></div>
                            <img src="../../.placeholders/astonmartin.png" alt="escuderia">
                            <p class="nom">${(piloto.apellido||'').substring(0,3).toUpperCase()}</p>
                            <p class="nombreCompleto">${piloto.nombre || ''} <b>${piloto.apellido || ''}</b></p>
                            <div class="tiempos"><p>${p.tiempo || ''}</p></div>
                        `;
                        div.addEventListener('click', ()=>{
                            if (piloto.numero) window.location.href = `../Piloto/index.html?n=${encodeURIComponent(piloto.numero)}`;
                        });
                        list.appendChild(div);
                        list.appendChild(document.createElement('hr'));
                    });
                }
            } catch (e) {
                console.error('Error cargando GP', e);
                document.getElementById('gpTitle').textContent = 'Error cargando datos (ver consola)';
                const list = document.getElementById('posicionesList');
                if (list) list.innerHTML = '<p>No hay posiciones disponibles</p>';
            }
        }

        window.addEventListener('scroll', updateHeroHeight);
        window.addEventListener('resize', updateHeroHeight);
        loadGPFromQuery();
        updateHeroHeight();
    </script>
</body>
</html>
